<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- signed out -->
  <section id="login" class="hidden">
    <div class="head"><strong>📺 Inspo</strong></div>
    <form id="login-form" class="pad">
      <input id="email" type="email" placeholder="email" autocomplete="username" required>
      <input id="password" type="password" placeholder="password" autocomplete="current-password" required>
      <button type="submit" id="login-btn">Sign in</button>
      <div id="login-error" class="error"></div>
    </form>
  </section>

  <!-- signed in -->
  <section id="main" class="hidden">
    <div class="head">
      <strong>📺 Inspo</strong>
      <span id="who" class="who"></span>
    </div>

    <div class="pad">
      <input id="search" placeholder="Search channels…" autocomplete="off">
    </div>

    <div id="save-card" class="save-card hidden">
      <img id="save-avatar" class="avatar" alt="">
      <div class="save-meta">
        <div id="save-title" class="t"></div>
        <div id="save-sub" class="s">on this tab</div>
      </div>
      <select id="save-folder"></select>
      <button id="save-btn">Save</button>
    </div>

    <div id="folders" class="folders"></div>
    <div id="list" class="list"></div>

    <div class="foot">
      <a id="open-dashboard" href="#">⚙ Dashboard</a>
      <span id="status" class="status"></span>
      <a id="signout" href="#">Sign out</a>
    </div>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
